name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/study-sprint
            git pull origin main

            # Backend
            cd backend
            npm install
            sudo systemctl restart node-service

            # Frontend
            cd ..
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/